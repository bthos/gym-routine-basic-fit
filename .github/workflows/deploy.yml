name: Deploy PWA to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run build

      - name: Purge jsDelivr cache for DATA SOURCES files
        continue-on-error: true
        env:
          REPO: ${{ github.repository }}
        run: |
          for path in \
            data/schema/rutina.schema.json \
            data/equipment.json \
            data/gyms.json \
            data/examples/phase1-monday.json; do
            curl -fsS "https://purge.jsdelivr.net/gh/$REPO@main/$path"
          done

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
